services:
  flask_app:
    build:
     context: .
     dockerfile: Dockerfile
     target: runner
    ports:
      - '5000:5000'
    env_file: ./.env
    environment:
      - DB_HOST=${DB_HOST}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - "5432:5432"
    env_file: ./.env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}